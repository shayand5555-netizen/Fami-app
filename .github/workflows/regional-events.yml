name: Regionale Familienveranstaltungen aktualisieren

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-regional-events.mjs'
      - '.github/workflows/regional-events.yml'
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-regional-events.mjs
      - name: Änderungen veröffentlichen
        run: |
          git config user.name "fami-event-bot"
          git config user.email "fami-event-bot@users.noreply.github.com"
          git add regional-events.json
          git diff --cached --quiet || git commit -m "Regionale Veranstaltungen aktualisieren"
          git push
