name: Rezept-Videokatalog aktualisieren

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-youtube-videos.mjs'
      - '.github/workflows/youtube-videos.yml'
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-youtube-videos.mjs
      - name: Änderungen veröffentlichen
        run: |
          git config user.name "fami-video-bot"
          git config user.email "fami-video-bot@users.noreply.github.com"
          git add recipe-videos.json
          git diff --cached --quiet || git commit -m "Rezept-Videokatalog aktualisieren"
          git push
